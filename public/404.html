<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | Rohit Kamble</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#e9e5db" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    @font-face { font-family: Anton; src: url(/fonts/anton-latin.woff2) format('woff2'); font-display: swap; }
    @font-face { font-family: Archivo; src: url(/fonts/archivo-var-latin.woff2) format('woff2'); font-weight: 100 900; font-display: swap; }
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #e9e5db; color: #141311;
      font-family: Archivo, system-ui, sans-serif; }
    main { max-width: 620px; }
    p.code { font: 500 12px/1 ui-monospace, Consolas, monospace; letter-spacing: .18em; text-transform: uppercase; color: #b3231a; }
    h1 { font-family: Anton, Impact, sans-serif; font-weight: 400; text-transform: uppercase; line-height: .86; margin: 18px 0;
      font-size: clamp(64px, 16vw, 150px); }
    h1 span { color: transparent; -webkit-text-stroke: 1.6px #141311; }
    p { color: #3b3934; line-height: 1.6; font-size: 17px; }
    a { display: inline-block; margin-top: 22px; padding: 16px 22px; background: #141311; color: #e9e5db; border: 2px solid #141311;
      box-shadow: 4px 4px 0 #b3231a; text-decoration: none; font: 500 12.5px/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
    a:focus-visible { outline: 3px solid #b3231a; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">// Error 404 — missing page</p>
    <h1>Page<br /><span>not found</span></h1>
    <p>This page was torn out of the volume, or it never existed.</p>
    <a href="/">Back to the cover →</a>
  </main>
</body>
</html>
